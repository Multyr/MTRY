[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Halmos requires AST output in the build artifacts (KeyError: 'ast' otherwise). Baked into
# the default profile so a plain `forge build` is always sufficient before running halmos.
ast = true

[profile.default.fuzz]
runs = 256

[profile.deep-fuzz]
fuzz = { runs = 10000 }

[profile.audit]
fuzz = { runs = 50000 }

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"

[etherscan]
arbitrum = { key = "${ARBISCAN_API_KEY}", chain = 42161, url = "https://api.arbiscan.io/api" }
